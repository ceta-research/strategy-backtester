# momentum_cascade LIVE / PAPER config (2026-10-11). Read by scripts/momentum_cascade_daily.py.
#
# Champion parameters unchanged. What differs from config_champion.yaml, and why:
#   data_provider: nse_charting_repaired  splits/stubs/recycled tickers repaired (B045-B047);
#                                         raw charting prints fake -50% bars on 2026 splits
#   end_epoch sentinel (2033)             run through the latest bar; the runner fails if the
#                                         last bar is >5 days behind India today
#   start_margin 50L, slippage 15 bps     the audited live-realistic base (AUDIT.md L9)
#   exit_before_entry: true               a next-open exit frees its slot the same morning
#   exit_fill: next_open                  a close-triggered exit sells at the next open
#   stop knobs: S0 x X0 (as-is)           PREREG.md verdict 2026-10-11: a stop from entry (S1 trail,
#                                         S2 fixed -15% floor) cut CAGR ~2pp on both windows for
#                                         ~1.5pp less drawdown, failing the <=1pp rule; an intraday
#                                         GTT stop (X1) HALVED CAGR (18.6 -> 10.2%). So: no stop
#                                         until the TSL arms, close-based trigger, sell at the
#                                         next open. The _gtt_trail.py ratchet is NOT used here.
#
# Reference on this base (S0X0, after the simulator sizing fix): 18.58% / -32.2% 2010->now,
# 18.10% / -32.2% over 20y (studies/momentum_cascade_audit/out/prereg_verdict.md).

static:
  strategy_type: momentum_cascade
  start_margin: 5000000
  start_epoch: 1262304000      # 2010-01-01
  end_epoch: 2000000000        # sentinel: 2033-05-18, NOT a real end
  prefetch_days: 600
  data_granularity: day
  data_provider: nse_charting_repaired
  slippage_rate: 0.0015

scanner:
  instruments:
    - [{exchange: NSE, symbols: []}]
  price_threshold: [50]
  avg_day_transaction_threshold:
    - {period: 125, threshold: 70000000}
  n_day_gain_threshold:
    - {n: 360, threshold: -999}

entry:
  fast_lookback_days: [42]
  slow_lookback_days: [42]
  accel_threshold_pct: [15]
  min_momentum_pct: [20]
  breakout_window: [252]
  regime_instrument: ['NSE:NIFTYBEES']
  regime_sma_period: [200]

exit:
  trailing_stop_pct: [15]
  max_hold_days: [378]
  exit_fill: [next_open]
  stop_mode: [close]
  trail_from_entry: [false]
  initial_stop_pct: [0]

simulation:
  default_sorting_type: [top_gainer]
  order_sorting_type: [top_gainer]
  order_ranking_window_days: [360]
  max_positions: [15]
  max_positions_per_instrument: [1]
  order_value_multiplier: [0.95]
  exit_before_entry: [true]
  max_order_value:
    - {type: percentage_of_instrument_avg_txn, value: 4.5}
