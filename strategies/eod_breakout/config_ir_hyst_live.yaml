# eod_breakout IR-hyst champion — LIVE SHORTLIST config (observe-only).
# Identical to config_ir_hyst_best.yaml EXCEPT end_epoch is pushed past the
# latest available data so the sim runs through the most recent close. The
# positions still OPEN at sim end (exit_reason=='end_of_data') ARE the
# strategy's current book / fresh buy shortlist. nse_charting = split-adjusted,
# current to the last trading day. NO orders are placed by anything that reads this.

static:
  strategy_type: eod_breakout
  start_margin: 10000000
  start_epoch: 1262304000
  # ⚠️ MUST stay far in the future. This is a sentinel meaning "run to the last
  # available close", NOT a real date — the sim clamps to whatever data exists.
  # 2026-09-30: the previous value 1790000000 was 2026-09-21 14:13 UTC, written
  # when that WAS beyond the data. The calendar caught up on 21-Sep and every
  # shortlist run after that was silently clamped to a frozen window: the 09-23
  # and 09-30 runs both reported "data through 2026-09-16" and an identical
  # empty book, which reads as "the strategy is in cash" rather than "the tool
  # stopped moving". Do not set this to a near-term date again.
  end_epoch: 2000000000          # 2033-05-18 — sentinel, comfortably beyond any real data
  prefetch_days: 500
  data_granularity: day
  data_provider: nse_charting

scanner:
  instruments:
    - [{exchange: NSE, symbols: []}]
  price_threshold: [99]
  avg_day_transaction_threshold:
    - {period: 125, threshold: 70000000}
  n_day_gain_threshold:
    - {n: 360, threshold: 0}

entry:
  n_day_high: [3]
  n_day_ma: [10]
  direction_score:
    - {n_day_ma: 5, score: 0.0}
  regime_instrument: [""]
  regime_sma_period: [0]
  force_exit_on_regime_flip: [true]
  internal_regime_sma_period: [50]
  internal_regime_threshold: [0.4]
  internal_regime_exit_threshold: [0.35]

exit:
  min_hold_time_days: [0]
  trailing_stop_pct: [8]

simulation:
  default_sorting_type: [top_gainer]
  order_sorting_type: [top_gainer]
  order_ranking_window_days: [180]
  max_positions: [15]
  max_positions_per_instrument: [1]
  order_value_multiplier: [1]
  max_order_value:
    - {type: percentage_of_instrument_avg_txn, value: 4.5}
