# IPO-age experiment ARM C-180 (2026-07-05): dose variant of armC — scanner-level
# age gate at 180 calendar days instead of 360. NOTE: 180d (~123 trading bars)
# is BELOW the ~181 bars top_gainer/180 needs, so a residual sliver of
# null-rank (queue-jumping) names remains in this arm — it is a dose point,
# not a clean bug-free arm. See config_ir_hyst_armC_scanage360.yaml.

static:
  strategy_type: eod_breakout
  start_margin: 10000000
  start_epoch: 1262304000
  end_epoch: 1773878400
  prefetch_days: 500
  data_granularity: day
  data_provider: nse_charting

scanner:
  instruments:
    - [{exchange: NSE, symbols: []}]
  price_threshold: [99]
  avg_day_transaction_threshold:
    - {period: 125, threshold: 70000000}
  n_day_gain_threshold:
    - {n: 360, threshold: 0}
  min_real_history_days: [180]

entry:
  n_day_high: [3]
  n_day_ma: [10]
  direction_score:
    - {n_day_ma: 5, score: 0.0}
  regime_instrument: [""]
  regime_sma_period: [0]
  force_exit_on_regime_flip: [true]
  internal_regime_sma_period: [50]
  internal_regime_threshold: [0.4]
  internal_regime_exit_threshold: [0.35]

exit:
  min_hold_time_days: [0]
  trailing_stop_pct: [8]

simulation:
  default_sorting_type: [top_gainer]
  order_sorting_type: [top_gainer]
  order_ranking_window_days: [180]
  max_positions: [15]
  max_positions_per_instrument: [1]
  order_value_multiplier: [1]
  max_order_value:
    - {type: percentage_of_instrument_avg_txn, value: 4.5}
