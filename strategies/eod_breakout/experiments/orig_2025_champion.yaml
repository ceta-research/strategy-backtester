# Replication of the ORIGINAL pandas ATO_Simulator run 1741266206.873597
# (2025-03-06), which logged CAGR 27.41% / maxDD 32.23% / AAR 102.48 in
# _notebooks/simulator_v2.ipynb. Config read from that run's own saved
# config/*.parquet + context/context.json, not reconstructed from memory.
#   window      start_epoch 1425906206 (2015-03-09) -> end_epoch 1741266206 (2026-03-06 equiv)
#   start_margin 9999999
#   scanner id 1 : price_threshold 45, avg_day_txn {125, 69999999}, n_day_gain {360, 0}
#   entry   id 1 : n_day_high 2, n_day_ma 3, direction_score {n_day_ma 3, score 0.54}
#   exit    id 1 : min_hold_time_days 0, trailing_stop_loss 15   <- the 27.41% arm
#   sim     id 1 : default top_gainer, order top_performer, window 180, max_positions 20
# NOTE the original read local data/tick_data; this runs nse_charting, and the
# warehouse has been backfilled since 2025, so an exact match is not expected.
# The question is whether the corrected engine lands in the same REGION.
static:
  strategy_type: eod_breakout
  start_margin: 9999999
  start_epoch: 1425906206
  end_epoch: 1741266206
  prefetch_days: 400
  data_granularity: day
  data_provider: nse_charting

scanner:
  instruments:
    - [{exchange: NSE, symbols: []}]
  price_threshold: [45]
  avg_day_transaction_threshold:
    - {period: 125, threshold: 69999999}
  n_day_gain_threshold:
    - {n: 360, threshold: 0}

entry:
  n_day_high: [2]
  n_day_ma: [3]
  direction_score:
    - {n_day_ma: 3, score: 0.54}
  regime_instrument: [""]
  regime_sma_period: [0]
  force_exit_on_regime_flip: [false]
  internal_regime_sma_period: [0]

exit:
  min_hold_time_days: [0]
  trailing_stop_pct: [15]

simulation:
  default_sorting_type: [top_gainer]
  order_sorting_type: [top_performer]
  order_ranking_window_days: [180]
  max_positions: [20]
  max_positions_per_instrument: [1]
  order_value_multiplier: [1]
  max_order_value:
    - {type: percentage_of_instrument_avg_txn, value: 4.5}
